services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: petmatch
      MYSQL_USER: ${DB_USER:-petmatch}
      MYSQL_PASSWORD: ${DB_PASSWORD:-petmatch_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: petmatch
      DB_USER: ${DB_USER:-petmatch}
      DB_PASSWORD: ${DB_PASSWORD:-petmatch_local}
    volumes:
      - .:/app:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
